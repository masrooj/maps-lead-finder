services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mapsleads
      POSTGRES_USER: mapsleads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapsleads -d mapsleads"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mapsleads:${POSTGRES_PASSWORD:-change-this-password}@db:5432/mapsleads
      RUNNING_IN_DOCKER: "1"
    # Reach BE / other host services published on the Mac (e.g. :3010).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
      # Live-reload app code without image rebuild (avoids hung/slow compose builds on low disk).
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
  # Daily ladder promote + Lost grace + optional email digest (08:00 local container TZ).
  # Set CRON_SECRET in .env to match app. Disable with PROFILE=nocron if needed.
  followup-cron:
    image: curlimages/curl:8.5.0
    restart: unless-stopped
    env_file: .env
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      APP_INTERNAL_URL: http://app:8000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "followup-cron: waiting for app…"
        sleep 30
        while true; do
          echo "followup-cron: $$(date -u +%Y-%m-%dT%H:%M:%SZ) tick"
          if [ -n "$$CRON_SECRET" ]; then
            curl -sS -X POST -H "X-Cron-Secret: $$CRON_SECRET" \
              "$$APP_INTERNAL_URL/api/cron/follow-up-reminders" || true
          else
            echo "followup-cron: CRON_SECRET unset — skip (set in .env)"
          fi
          # ~24h; boot + confirm-sent still promote opportunistically
          sleep 86400
        done
    depends_on:
      - app
volumes:
  postgres_data:
  uploads_data:
